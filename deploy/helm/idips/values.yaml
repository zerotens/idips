# Default values for the IDIPS Helm chart.
# IDIPS keeps its runtime configuration in SQLite, so most settings (listeners,
# fake-IP pool, upstreams, rules) are changed in the admin UI or REST API.
# Only bootstrap values (admin credentials, master key, log level) are set here.

replicaCount: 1

image:
  repository: ghcr.io/zerotens/idips
  # Empty means the chart's appVersion, which corresponds to the released image.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Data directory inside the container. Must match the persistence mount path.
dataDir: /data

# Bootstrap admin. IDIPS only uses these on the very first start (empty DB).
# If adminPassword or masterKey is empty, a random value is generated once and
# reused on subsequent upgrades via a lookup of the existing Secret.
# For GitOps tools that do not support `lookup`, set both values explicitly.
auth:
  adminUser: admin
  adminPassword: ""
  masterKey: ""
  # Use an existing Secret instead of creating one. It must contain the keys
  # IDIPS_ADMIN_USER, IDIPS_ADMIN_PASSWORD and IDIPS_MASTER_KEY.
  existingSecret: ""

logLevel: info

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

# The container needs NET_BIND_SERVICE to listen on DNS port 53. It runs as
# root by default because the upstream image does not define a non-root user.
# If you switch to a non-root user, use high ports in the IDIPS settings and
# update containerPorts/service.ports accordingly.
securityContext:
  runAsUser: 0
  runAsGroup: 0
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE

# Container ports must match the listeners configured in IDIPS settings.
containerPorts:
  - name: admin
    containerPort: 8080
    protocol: TCP
  - name: socks5
    containerPort: 1080
    protocol: TCP
  - name: http-proxy
    containerPort: 8081
    protocol: TCP
  - name: dns-udp
    containerPort: 53
    protocol: UDP
  - name: dns-tcp
    containerPort: 53
    protocol: TCP
  - name: dot
    containerPort: 853
    protocol: TCP
  - name: tproxy
    containerPort: 1082
    protocol: TCP

service:
  enabled: true
  type: ClusterIP
  annotations: {}
  # Set to Local when clients must reach this specific node (for example DNS
  # with hostNetwork).
  externalTrafficPolicy: ""
  loadBalancerIP: ""
  loadBalancerSourceRanges: []
  # DNS needs both TCP and UDP. Uncomment dot/tproxy if you enable them.
  ports:
    - name: admin
      port: 8080
      targetPort: admin
      protocol: TCP
    - name: socks5
      port: 1080
      targetPort: socks5
      protocol: TCP
    - name: http-proxy
      port: 8081
      targetPort: http-proxy
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
    # - name: dot
    #   port: 853
    #   targetPort: dot
    #   protocol: TCP
    # - name: tproxy
    #   port: 1082
    #   targetPort: tproxy
    #   protocol: TCP

# HTTP probes against /api/health (unauthenticated, includes a DB ping).
# If you enable TLS on the admin listener in IDIPS settings, switch the probes
# to tcpSocket or use another listener, otherwise they will fail.
probes:
  liveness:
    enabled: true
    httpGet:
      path: /api/health
      port: admin
      scheme: HTTP
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    httpGet:
      path: /api/health
      port: admin
      scheme: HTTP
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    enabled: true
    httpGet:
      path: /api/health
      port: admin
      scheme: HTTP
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30

persistence:
  enabled: true
  # Use an existing PVC instead of creating one (must be ReadWriteOnce and
  # mounted at dataDir).
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Service port name used for the ingress backend.
  servicePort: admin
  # The admin UI and DoH (/dns-query) share this listener.
  hosts:
    - host: idips.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: idips-tls
  #   hosts:
  #     - idips.local

# TPROXY requires host networking, NET_ADMIN/NET_RAW and matching nftables rules
# on the node. Enabling this only adds the capabilities; it does not install the
# nftables rules (see scripts/nftables-tproxy.sh).
tproxy:
  enabled: false

hostNetwork: false

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

terminationGracePeriodSeconds: 30

extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []
