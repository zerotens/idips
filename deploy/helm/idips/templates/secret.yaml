{{- if not .Values.auth.existingSecret }}
{{- $secretName := include "idips.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "idips.labels" . | nindent 4 }}
type: Opaque
data:
  IDIPS_ADMIN_USER: {{ .Values.auth.adminUser | b64enc | quote }}
  {{- if .Values.auth.adminPassword }}
  IDIPS_ADMIN_PASSWORD: {{ .Values.auth.adminPassword | b64enc | quote }}
  {{- else if and $existing (hasKey $existing.data "IDIPS_ADMIN_PASSWORD") }}
  IDIPS_ADMIN_PASSWORD: {{ index $existing.data "IDIPS_ADMIN_PASSWORD" | quote }}
  {{- else }}
  IDIPS_ADMIN_PASSWORD: {{ randAlphaNum 24 | b64enc | quote }}
  {{- end }}
  {{- if .Values.auth.masterKey }}
  IDIPS_MASTER_KEY: {{ .Values.auth.masterKey | b64enc | quote }}
  {{- else if and $existing (hasKey $existing.data "IDIPS_MASTER_KEY") }}
  IDIPS_MASTER_KEY: {{ index $existing.data "IDIPS_MASTER_KEY" | quote }}
  {{- else }}
  IDIPS_MASTER_KEY: {{ randBytes 32 | b64enc | quote }}
  {{- end }}
{{- end }}
