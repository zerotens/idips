{{- $containerSecurityContext := deepCopy .Values.securityContext }}
{{- if .Values.tproxy.enabled }}
{{- $_ := set $containerSecurityContext "capabilities" (default (dict) $containerSecurityContext.capabilities) }}
{{- $add := default (list) $containerSecurityContext.capabilities.add }}
{{- $_ := set $containerSecurityContext.capabilities "add" (concat $add (list "NET_ADMIN" "NET_RAW") | uniq) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "idips.fullname" . }}
  labels:
    {{- include "idips.labels" . | nindent 4 }}
spec:
  # SQLite is single-node only. Do not increase replicas.
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "idips.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "idips.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "idips.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      hostNetwork: {{ .Values.hostNetwork }}
      {{- if .Values.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: idips
          image: {{ include "idips.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -data
            - {{ .Values.dataDir }}
          securityContext:
            {{- toYaml $containerSecurityContext | nindent 12 }}
          ports:
            {{- toYaml .Values.containerPorts | nindent 12 }}
          env:
            - name: IDIPS_DATA
              value: {{ .Values.dataDir | quote }}
            - name: IDIPS_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: IDIPS_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "idips.secretName" . }}
                  key: IDIPS_ADMIN_USER
            - name: IDIPS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "idips.secretName" . }}
                  key: IDIPS_ADMIN_PASSWORD
            - name: IDIPS_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "idips.secretName" . }}
                  key: IDIPS_MASTER_KEY
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.startup }}
          {{- if .enabled }}
          startupProbe:
            {{- omit . "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.probes.liveness }}
          {{- if .enabled }}
          livenessProbe:
            {{- omit . "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.probes.readiness }}
          {{- if .enabled }}
          readinessProbe:
            {{- omit . "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.dataDir }}
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "idips.pvcName" . }}
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
