name: Release Helm chart

on:
  push:
    branches:
      - main
    paths:
      - "deploy/helm/idips/**"
      - ".github/workflows/release-chart.yml"
    tags:
      - "v*.*.*"
      - "chart-v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: helm-chart-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish OCI chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint and render chart
        run: |
          helm lint deploy/helm/idips
          helm template idips deploy/helm/idips > /dev/null

      - name: Read chart metadata
        id: chart
        run: |
          set -euo pipefail
          name="$(helm show chart deploy/helm/idips | awk '$1 == "name:" { print $2 }')"
          version="$(helm show chart deploy/helm/idips | awk '$1 == "version:" { print $2 }')"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Package chart
        run: helm package deploy/helm/idips --destination dist

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push chart
        env:
          CHART_NAME: ${{ steps.chart.outputs.name }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
        run: |
          set -euo pipefail
          repository="oci://ghcr.io/${GITHUB_REPOSITORY}/charts"
          reference="${repository}/${CHART_NAME}"

          if helm show chart "$reference" --version "$CHART_VERSION" > /dev/null 2>&1; then
            echo "Chart ${CHART_NAME}:${CHART_VERSION} is already published; skipping."
            exit 0
          fi

          helm push "dist/${CHART_NAME}-${CHART_VERSION}.tgz" "$repository"

      - name: Write summary
        env:
          CHART_NAME: ${{ steps.chart.outputs.name }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
        run: |
          {
            echo "## Helm chart published"
            echo
            echo '```bash'
            echo "helm install idips oci://ghcr.io/${GITHUB_REPOSITORY}/charts/${CHART_NAME} --version ${CHART_VERSION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
